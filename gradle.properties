android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 本机 16GB 内存，常驻 Android Studio 之后只剩 ~1GB 可用。
# 默认配置会让 Gradle 守护进程 + Kotlin 守护进程（两个 JVM）把系统打爆，
# 报 os::commit_memory errno=1455 或 JVM crash（hs_err_pid*.log）。
#
# 对策：只有一个 JVM（Kotlin 编译器跑在 Gradle 进程内），并把堆压小。
org.gradle.jvmargs=-Xmx1200m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
