<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="katex/katex.min.css">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body {
    font-family: -apple-system, "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
    font-size: 15px;
    line-height: 1.72;
    color: #1a1a1a;
    padding: 0 2px 8px 2px;
    -webkit-text-size-adjust: 100%;
    word-break: break-word;
    /* 禁选。复制改成了"点区域即复制该区域内容"（见 OcrStreamScreen.applySelection），
     * 不需要网页内手动选词；放开 selectable 会额外冒出系统选词工具条，和底部提示条打架。
     * 长按公式仍然走自己的 LaTeX 复制（见下方 .katex 规则）。 */
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  h1 { font-size: 21px; margin: 4px 0 10px; line-height: 1.35; }
  h2 { font-size: 17px; margin: 18px 0 8px; color: #185fa5; }
  h3 { font-size: 15px; margin: 14px 0 6px; }
  p  { margin: 8px 0; }
  ul { margin: 8px 0; padding-left: 22px; }
  li { margin: 4px 0; }
  img { max-width: 100%; height: auto; display: block; margin: 10px auto; border-radius: 6px; }
  /* 还没确认加载成功的图片先占一块可见的灰底。
   * 好处：出问题时能一眼区分「元素压根没创建（连灰块都没有）」和
   * 「元素在、但图没加载出来（有灰块）」，不用再靠猜。
   * 加载成功后 imgLoaded() 会打上 data-ok，这条样式就自动失效。 */
  img:not([data-ok]) { min-height: 56px; background: #f1f3f5; }
  blockquote {
    margin: 10px 0; padding: 8px 12px;
    border-left: 3px solid #b5d4f4; background: #f4f8fd;
    color: #444441; font-size: 14px;
  }
  code {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    background: #f1f3f5; padding: 1px 4px; border-radius: 3px; font-size: 13px;
  }
  pre {
    background: #f1f3f5; padding: 10px; border-radius: 6px; overflow-x: auto;
    font-size: 13px; line-height: 1.5;
  }
  pre code { background: none; padding: 0; }
  .math-block { margin: 12px 0; overflow-x: auto; overflow-y: hidden; }
  .katex-display { margin: 0; }
  .katex { font-size: 1.08em; }
  /* 公式统一染主色调（珊瑚橘 #CC785C）。Light / Dark 两套主题的 primary 恰好同值，
     所以这里可以直接写死，不用跟着主题切换。
     分数线、根号、括号都用 currentColor，只设 .katex 一处即可整块跟随。 */
  .katex { color: #CC785C; }
  /* 绾靛悜鑱斿姩鐨勫尯鍩熼珮浜細宸︾珫绾?+ 娣″簳锛屼笉鐢ㄨ竟妗嗭紙閬垮厤鎺ㄦ尋甯冨眬锛?*/
  [data-blk].blk-hit {
    background: rgba(204, 120, 92, 0.10);
    box-shadow: inset 3px 0 0 #CC785C;
    border-radius: 4px;
  }
  /* 长按取源码：必须关掉 WebView 自带的选择手势，否则长按满 500ms 会先弹出
   * 系统的选词/复制菜单，把我们自己的长按按掉了。 */
  .katex, .katex * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .katex.tex-hit { outline: 2px solid #185fa5; outline-offset: 3px; border-radius: 4px; }
  .err { color: #a32d2d; font-family: monospace; font-size: 13px; }
  /* 图片加载失败时不再静默留白，给一条能看出原因的红条 */
  .img-err {
    color: #a32d2d; background: #fdeeee; border: 1px solid #f0c9c9;
    padding: 8px 10px; border-radius: 6px; margin: 10px 0;
    font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace;
    word-break: break-all;
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="katex/katex.min.js"></script>
<script>
var KOPT = { throwOnError: false, strict: false, trust: false };

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function balance(tex) {
  // 砍掉流式截断的半截命令（x + \fra）。但如果砍完什么都不剩，说明这条公式
  // 本身就是一个命令（\Delta / \pi / \alpha），那是完整的，不能砍。
  var cut = tex.replace(/\\[a-zA-Z]*$/, '');
  if (cut.trim()) tex = cut;
  var open = 0;
  for (var i = 0; i < tex.length; i++) {
    if (tex[i] === '{') open++;
    else if (tex[i] === '}') open--;
  }
  while (open-- > 0) tex += '}';
  var l = (tex.match(/\\left/g) || []).length;
  var r = (tex.match(/\\right/g) || []).length;
  if (l > r) tex += '\\right.';
  return tex;
}

function renderMath(tex, display, closed) {
  var body = closed ? tex : balance(tex);
  try {
    return katex.renderToString(body, Object.assign({ displayMode: display }, KOPT));
  } catch (e) {
    return '<span class="err">' + esc(tex) + '</span>';
  }
}

function inline(s) {
  // 图片和公式在同一次扫描里切分，避免互相破坏：
  //   - 先 esc 再匹配会把 $a > 0$ 的 > 变成 &gt;，KaTeX 直接解析失败
  //   - 先替换图片会把图片 URL 里的字符也搅进去
  // 顺带支持段落中间嵌图（![x](y) 不在行首时也能渲染），
  // 以及带 title 的写法 ![x](y "标题")。
  var out = '';
  var re = /!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)|\$([^$]+?)\$/g;
  var last = 0;
  var m;
  while ((m = re.exec(s)) !== null) {
    out += esc(s.slice(last, m.index));
    if (m[1] !== undefined) {
      var isrc = resolveSrc(m[2]);
      out += '<img src="' + isrc + '" alt="' + esc(m[1]) +
             '" data-src="' + esc(isrc) + '"' +
             ' onload="imgLoaded(this)" onerror="imgFail(this)">';
    } else {
      out += renderMath(m[3], false, true);
    }
    last = m.index + m[0].length;
  }
  out += esc(s.slice(last));
  out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
  return out;
}

function parseBlocks(src) {
  var lines = src.split('\n');
  var blocks = [];
  // 区域锚点：Kotlin 侧在每个「已完成区域」的内容前插一行 @@blk:b0001@@
  // （正在打字的那个区域不加，否则标记会被逐字打出来）。
  // 有了它，DOM 才知道某几块属于哪个识别区域，上下联动（点框→滚到文本、点文本→框高亮）才做得到。
  var curBlk = '';
  function push(o) { o.blk = curBlk; blocks.push(o); }
  var i = 0;
  while (i < lines.length) {
    var line = lines[i];
    if (!line.trim()) { i++; continue; }

    var bm = /^@@blk:([A-Za-z0-9_]*)@@$/.exec(line.trim());
    if (bm) { curBlk = bm[1]; i++; continue; }

    if (line.trim().indexOf('$$') === 0) {
      var buf = line.trim().slice(2);
      if (buf.slice(-2) === '$$') {
        push({ t: 'math', s: buf.slice(0, -2), closed: true }); i++; continue;
      }
      var closed = false;
      i++;
      while (i < lines.length) {
        if (lines[i].indexOf('$$') >= 0) {
          buf += '\n' + lines[i].slice(0, lines[i].indexOf('$$'));
          closed = true; i++; break;
        }
        buf += '\n' + lines[i]; i++;
      }
      push({ t: 'math', s: buf, closed: closed });
      continue;
    }

    var m = /^(#{1,3})\s+(.*)$/.exec(line);
    if (m) { push({ t: 'h' + m[1].length, s: m[2] }); i++; continue; }

    m = /^!\[([^\]]*)\]\(([^)]+)\)\s*$/.exec(line.trim());
    if (m) { push({ t: 'img', alt: m[1], src: m[2] }); i++; continue; }

    if (line.trim().indexOf('> ') === 0) {
      var q = [];
      while (i < lines.length && lines[i].trim().indexOf('> ') === 0) {
        q.push(lines[i].trim().slice(2)); i++;
      }
      push({ t: 'quote', s: q.join(' ') });
      continue;
    }

    if (line.trim().indexOf('```') === 0) {
      i++;
      var code = [];
      while (i < lines.length && lines[i].trim().indexOf('```') !== 0) { code.push(lines[i]); i++; }
      i++;
      push({ t: 'code', s: code.join('\n') });
      continue;
    }

    if (/^\s*[-*]\s+/.test(line)) {
      var items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*[-*]\s+/, '')); i++;
      }
      push({ t: 'ul', items: items });
      continue;
    }

    // 注意：这里故意不再排除 `![`，因为 inline() 已经能渲染段落中间的图片。
    // 之前把 `![` 当块起始排除掉，一旦遇到「以 ![ 开头但不匹配整行图片正则」的行
    // （比如 ![a](b.png) 后面还跟了别的文字），while 一次都不进、i 不前进，
    // 直接死循环把 WebView 的 JS 线程彻底卡死 —— 表现就是整块内容不渲染。
    var para = [];
    while (i < lines.length && lines[i].trim() &&
           !/^(#{1,3}\s|\s*[-*]\s|>\s|\$\$|```)/.test(lines[i])) {
      para.push(lines[i]); i++;
    }
    if (para.length === 0) { para.push(lines[i]); i++; }  // 死循环保险
    push({ t: 'p', s: para.join(' ') });
  }
  return blocks;
}

/* 图片地址归一化。
 * markdown 里常见三种写法，WebView 下只有绝对 file:// 和完整 http 能直接过：
 *   file:///android_asset/img/a.png  -> 原样
 *   https://...                      -> 原样
 *   img/a.png  ./img/a.png           -> 补成 file:///android_asset/img/a.png
 * 不补的话相对路径会以 render.html 为基准解析，指错位置就静默 404。 */
function resolveSrc(src) {
  if (/^(https?:|data:|file:|content:)/i.test(src)) return src;
  return 'file:///android_asset/' + src.replace(/^\.?\//, '');
}

function blockHtml(b) {
  switch (b.t) {
    case 'h1': return '<h1>' + inline(b.s) + '</h1>';
    case 'h2': return '<h2>' + inline(b.s) + '</h2>';
    case 'h3': return '<h3>' + inline(b.s) + '</h3>';
    case 'p': return '<p>' + inline(b.s) + '</p>';
    case 'quote': return '<blockquote>' + inline(b.s) + '</blockquote>';
    case 'code': return '<pre><code>' + esc(b.s) + '</code></pre>';
    case 'img': {
      var src = resolveSrc(b.src);
      return '<img src="' + src + '" alt="' + esc(b.alt) +
             '" data-src="' + esc(src) + '"' +
             ' onload="imgLoaded(this)" onerror="imgFail(this)">';
    }
    case 'ul': return '<ul>' + b.items.map(function (x) { return '<li>' + inline(x) + '</li>'; }).join('') + '</ul>';
    case 'math': return '<div class="math-block">' + renderMath(b.s, true, b.closed) + '</div>';
    default: return '';
  }
}

/* ------------------------------------------------------------------
 * 图片加载失败的两级兜底
 *   1. 先试 src 原样（App 内是 file:///android_asset/img/xxx.png，能过）
 *   2. 失败则换成内联 base64（浏览器直接打开 render.html 时走这条）
 *   3. 再失败才显示红条，把失败的 URL 打印出来 —— 不再静默留白
 * ------------------------------------------------------------------ */
function imgFail(el) {
  var src = el.getAttribute('data-src') || el.getAttribute('src') || '';
  var key = src.replace('file:///android_asset/', '');
  if (!el.__retried && window.IMG_FALLBACK && IMG_FALLBACK[key]) {
    el.__retried = true;
    el.src = IMG_FALLBACK[key];
    if (window.console) console.warn('[img] 回退 base64: ' + src);
    return;
  }
  if (window.console) console.warn('[img] 加载失败: ' + src);
  var box = document.createElement('div');
  box.className = 'img-err';
  box.textContent = '图片加载失败：' + src;
  if (el.parentNode) el.parentNode.replaceChild(box, el);
}

/* onload 也可能「成功」但没有像素 —— 解码静默失败时 naturalWidth 是 0，
 * 表现就是一片空白且没有红条。这里补一道检查。 */
function imgLoaded(el) {
  if (!el.naturalWidth || !el.naturalHeight) {
    if (window.console) console.warn('[img] 解码后尺寸为 0: ' + (el.getAttribute('data-src') || ''));
    imgFail(el);
    return;
  }
  el.setAttribute('data-ok', '1');
}

/* 兜底巡检：src 无效、被策略阻断、解码静默失败这几种情况下，
 * onload / onerror 可能一个都不触发，用户看到的就是「图位置一片空白、也没有红条」。
 * 渲染完 1.2s 后统一扫一遍，凡是已 complete 但 naturalWidth 仍为 0 的，一律露出错误。 */
var auditTimer = null;

function auditImages() {
  var list = document.querySelectorAll('img:not([data-ok])');
  var bad = 0;
  for (var i = 0; i < list.length; i++) {
    var el = list[i];
    if (el.complete && !el.naturalWidth) { bad++; imgFail(el); }
  }
  if (bad && window.console) console.warn('[img] 巡检发现 ' + bad + ' 张图未渲染');
}

/* 内联图片兜底：浏览器直接打开 render.html 时 file:///android_asset/ 必然 404，
 * 这里放一份 base64，imgFail() 会回退过来。App 内正常时不会用到。 */

var prev = [];
var pushedByHost = false;

function setMarkdown(text) {
  pushedByHost = true;
  bindBlockTap();
  var blocks = parseBlocks(text);
  var i = 0;
  while (i < prev.length && i < blocks.length &&
         prev[i].sig === JSON.stringify(blocks[i])) i++;

  var root = document.getElementById('root');
  for (var j = i; j < prev.length; j++) {
    if (prev[j].el && prev[j].el.parentNode) prev[j].el.parentNode.removeChild(prev[j].el);
  }
  var next = prev.slice(0, i);
  for (var k = i; k < blocks.length; k++) {
    var wrap = document.createElement('div');
    if (blocks[k].blk) wrap.setAttribute('data-blk', blocks[k].blk);
    wrap.innerHTML = blockHtml(blocks[k]);
    root.appendChild(wrap);
    blocks[k].el = wrap;
    blocks[k].sig = JSON.stringify(blocks[k], function (key, val) {
      return key === 'el' ? undefined : val;
    });
    next.push(blocks[k]);
  }
  prev = next;
  applyHighlight();   /* 鍧楄 diff 閲嶅缓鍚?class 浼氫涪锛岃繖閲岃ˉ鍥炴潵 */
  reportHeight();
  if (auditTimer) clearTimeout(auditTimer);
  auditTimer = setTimeout(function () {
    auditImages();
    reportHeight();
    if (window.Android && window.Android.onProbe) window.Android.onProbe(latexProbe());
  }, 1200);
}

/* ==================================================================
 * 长按公式 → 复制 LaTeX 源码
 *
 * 这里演示的正是 KaTeX 路线最值钱的一点：源码不是另外存一份，
 * 而是渲染产物里本来就有 ——
 *     <annotation encoding="application/x-tex">\frac{-b\pm\sqrt{…}}{2a}</annotation>
 * 也就是说，哪怕手上只剩一个已经渲染好的 DOM，也能把原文反查回来。
 * 注意 output:'html' 模式不生成这个节点，本页用的是默认 htmlAndMathml，所以有。
 * ================================================================== */
var LP_MS = 420;          // 长按判定阈值
var LP_SLOP = 10;         // 手指移动超过这个像素数就不算长按（当滚动处理）

function texFromEl(k) {
  if (!k) return null;
  var a = k.querySelector('annotation[encoding="application/x-tex"]');
  if (a && a.textContent) return { tex: a.textContent, from: 'annotation' };
  var d = k.getAttribute('data-tex');
  if (d) return { tex: d, from: 'data-tex' };
  return null;
}

function texOf(el) {
  if (!el || !el.closest) return null;
  return texFromEl(el.closest('.katex'));
}

/* 按几何范围找公式，而不是信任 event.target。
 * 原因：KaTeX 的 HTML 层是一堆绝对定位的 span，点在字形之间的缝里、或者落在
 * 外层包裹 div 上时，target 根本不在 .katex 里 —— 只靠 closest() 会大面积漏判。
 * 手指长按本来就不精确，用包围盒 + 6px 容差更符合预期。 */
function texAt(x, y) {
  var list = document.querySelectorAll('.katex');
  var best = null, bestArea = Infinity;
  for (var i = 0; i < list.length; i++) {
    var r = list[i].getBoundingClientRect();
    if (x >= r.left - 6 && x <= r.right + 6 && y >= r.top - 6 && y <= r.bottom + 6) {
      var area = r.width * r.height;
      if (area < bestArea) { bestArea = area; best = list[i]; }   // 嵌套时取最小的那个
    }
  }
  return best ? texFromEl(best) : null;
}

function markHit(k) {
  if (!k) return;
  k.classList.add('tex-hit');
  setTimeout(function () { k.classList.remove('tex-hit'); }, 900);
}

/* 去重：同一条公式在 800ms 内只交付一次。
 * 原因是 WebView 除了我们的 pointerdown 计时器，还会在约 500ms 时补发一个
 * contextmenu 事件 —— 两个都走 deliver，就会连弹两个 Toast、写两次剪贴板。 */
var lastDeliverAt = 0, lastDeliverTex = '';

function deliver(tex, from, el) {
  var now = Date.now();
  if (tex && tex === lastDeliverTex && now - lastDeliverAt < 800) return;
  lastDeliverAt = now;
  lastDeliverTex = tex || '';
  markHit(el && el.closest ? el.closest('.katex') : null);
  if (window.Android && window.Android.onCopyLatex) {
    window.Android.onCopyLatex(tex || '', from);   // Kotlin 侧写剪贴板 + Toast
  } else if (window.console) {
    console.log('[copy] ' + from + ' -> ' + (tex || '(空)'));
  }
}

var lpTimer = null, lpX = 0, lpY = 0, lpTarget = null;

function cancelLp() {
  if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; }
}

document.addEventListener('pointerdown', function (e) {
  cancelLp();
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  var t = texOf(e.target) || texAt(e.clientX, e.clientY);
  if (window.console) {
    var cls = (e.target && e.target.className) || '';
    var ks = document.querySelectorAll('.katex');
    var info = '';
    for (var d = 0; d < ks.length && d < 3; d++) {
      var rr = ks[d].getBoundingClientRect();
      info += '[' + Math.round(rr.left) + ',' + Math.round(rr.top) + ',' +
              Math.round(rr.right) + ',' + Math.round(rr.bottom) + ']';
    }
    console.warn('[lp] down type=' + e.pointerType + ' hit=' + !!t +
      ' cls=' + String(cls).slice(0, 40) +
      ' xy=' + Math.round(e.clientX) + ',' + Math.round(e.clientY) +
      ' dpr=' + (window.devicePixelRatio || 0) +
      ' iw=' + window.innerWidth + ' n=' + ks.length +
      ' rects=' + info);
  }
  if (!t) return;                       // 不是公式，交给 WebView 正常滚动
  lpX = e.clientX;
  lpY = e.clientY;
  lpTarget = e.target;
  lpTimer = setTimeout(function () {
    lpTimer = null;
    deliver(t.tex, t.from, lpTarget);
  }, LP_MS);
}, { passive: true });

document.addEventListener('pointermove', function (e) {
  if (!lpTimer) return;
  var dx = e.clientX - lpX;
  var dy = e.clientY - lpY;
  if (dx * dx + dy * dy > LP_SLOP * LP_SLOP) cancelLp();
}, { passive: true });

document.addEventListener('pointerup', function (e) {
  cancelLp();
  if (window.console) {
    var cs = getComputedStyle(document.body).userSelect ||
             getComputedStyle(document.body).webkitUserSelect;
    console.warn('[lp] up bodyUserSelect=' + cs +
      ' selAtUp=' + JSON.stringify(String(window.getSelection())));
    setTimeout(function () {
      console.warn('[lp] sel+800=' + JSON.stringify(String(window.getSelection())));
    }, 800);
  }
}, { passive: true });
document.addEventListener('pointercancel', cancelLp, { passive: true });

/* 桌面浏览器里没有长按，用右键代替，方便直接在 Chrome 里验证 */
document.addEventListener('contextmenu', function (e) {
  var t = texOf(e.target) || texAt(e.clientX, e.clientY);
  if (!t) return;
  e.preventDefault();
  deliver(t.tex, t.from, e.target);
});

/* 反查取证：数一遍 DOM 里有多少公式、多少条带 TeX annotation。
 * 这个数字是「从渲染产物里挖出来的」，不是我们另外记的账。 */
function latexProbe() {
  var all = document.querySelectorAll('.katex');
  var withTex = 0, chars = 0, sample = '';
  for (var i = 0; i < all.length; i++) {
    var a = all[i].querySelector('annotation[encoding="application/x-tex"]');
    if (a && a.textContent) {
      withTex++;
      chars += a.textContent.length;
      if (!sample) sample = a.textContent;
    }
  }
  return JSON.stringify({
    formulas: all.length,
    withTex: withTex,
    chars: chars,
    htmlNodes: document.querySelectorAll('.katex-html').length,
    mathmlNodes: document.querySelectorAll('.katex math').length,
    sample: sample.slice(0, 48)
  });
}
window.latexProbe = latexProbe;

function reportHeight() {
  if (window.Android && window.Android.onHeight) {
    var h = Math.ceil(document.body.getBoundingClientRect().height * (window.devicePixelRatio || 1));
    window.Android.onHeight(h);
  }
}

/* ---------------- 上下联动：区域高亮 + 点击回传 ---------------- */
var curHighlight = '';

function applyHighlight() {
  var hit = document.querySelectorAll('.blk-hit');
  for (var i = 0; i < hit.length; i++) hit[i].classList.remove('blk-hit');
  if (!curHighlight) return;
  var els = document.querySelectorAll('[data-blk="' + curHighlight + '"]');
  for (var j = 0; j < els.length; j++) els[j].classList.add('blk-hit');
}

/* 由 Kotlin 调：highlightBlock('b0005') / highlightBlock('') */
function highlightBlock(id) {
  curHighlight = id || '';
  applyHighlight();
  if (!curHighlight) return;
  var first = document.querySelector('[data-blk="' + curHighlight + '"]');
  if (first && first.scrollIntoView) {
    first.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
}
window.highlightBlock = highlightBlock;

/* 点文本 → 回传区域 id 给 Kotlin。事件委托挂在 root 上：
 * 流式期间块会被重建，逐个绑监听会漏，委托不会。 */
function bindBlockTap() {
  var root = document.getElementById('root');
  if (!root || root.getAttribute('data-blk-bound') === '1') return;
  root.setAttribute('data-blk-bound', '1');
  root.addEventListener('click', function (e) {
    var el = e.target && e.target.closest ? e.target.closest('[data-blk]') : null;
    if (el && window.Android && window.Android.onBlockTap) {
      window.Android.onBlockTap(el.getAttribute('data-blk'));
    }
  });
}

if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.body);
window.addEventListener('load', reportHeight);
