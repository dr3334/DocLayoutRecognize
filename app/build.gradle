plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// 调试用凭据从 local.properties 读 —— 该文件已在 .gitignore 里，
// 所以 Token 不会跟着代码进仓库，别人 clone 下来也拿不到。
// 没有这个键也能编译，只是 BuildConfig.OCR_TOKEN 是空串。
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

android {
    namespace 'com.doclayout.recognize'
    compileSdk 35

    defaultConfig {
        applicationId "com.doclayout.recognize"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        // RaTeX 的 AAR 带三套 .so，只保留真机 + 模拟器两套
        ndk { abiFilters 'arm64-v8a', 'x86_64' }

        // 预置 Access Token：设置页里没填过时用它兜底（见 OcrSettingsStore.credential）。
        // 值来自 local.properties 的 ocr.token，仓库里看不到明文。
        buildConfigField "String", "OCR_TOKEN", "\"${localProps.getProperty('ocr.token', '')}\""
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        compose = true
        // AGP 8 起 BuildConfig 默认不生成，要显式打开（上面的 buildConfigField 依赖它）
        buildConfig = true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui:1.7.6'
    implementation 'androidx.compose.foundation:foundation:1.7.6'
    implementation 'androidx.compose.material3:material3:1.3.1'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.7.6'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.7.6'

    // Markdown 渲染（识别结果是整篇 markdown）
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-latex:4.6.2'
    implementation 'io.noties.markwon:inline-parser:4.6.2'
    implementation 'io.noties.markwon:image:4.6.2'
    implementation 'ru.noties:jlatexmath-android:0.2.0'

    // 示例记录的公式渲染（Rust 核心 + Canvas，不用 WebView）
    implementation 'io.github.erweixin:ratex-android:0.1.15'
}
